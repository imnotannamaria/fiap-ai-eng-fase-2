[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cancer-diagnosis-optimization"
version = "0.1.0"
description = "Otimização de modelos de diagnóstico de câncer de mama para o Tech Challenge FIAP - Fase 2"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
